<style id="ivf-welcome-static-style">
.splashLogo{display:none !important}
.ivf-welcome{position:fixed;inset:0;z-index:2147483000;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;opacity:1;transition:opacity .45s ease;font-family:inherit;color:#fff;pointer-events:none}
.ivf-welcome.ivf-out{opacity:0}
.ivf-welcome-glow{position:absolute;width:95vh;height:95vh;border-radius:50%;background:radial-gradient(circle,rgba(0,164,220,.18) 0%,transparent 65%);animation:ivfGlow 3s ease-in-out infinite}
.ivf-welcome-cat{position:relative;width:44vh;height:44vh;border-radius:50%;background:center/cover no-repeat;box-shadow:0 0 0 .8vh rgba(255,255,255,.9),0 1.5vh 6vh rgba(0,0,0,.8);animation:ivfBreathe 2.6s ease-in-out infinite, ivfIn .6s ease-out both}
.ivf-welcome-hi{position:relative;font-size:8.5vh;font-weight:700;letter-spacing:.02em;animation:ivfIn .6s .15s ease-out both}
.ivf-welcome-line{position:relative;font-size:4.2vh;opacity:.8;min-height:5.4vh;animation:ivfIn .6s .3s ease-out both;transition:opacity .3s}
.ivf-welcome-dots{position:relative;display:flex;gap:2vh;margin-top:1.5vh;animation:ivfIn .6s .45s ease-out both}
.ivf-welcome-dots span{width:2.2vh;height:2.2vh;border-radius:50%;background:#fff;animation:ivfDot 1.2s ease-in-out infinite}
.ivf-welcome-dots span:nth-child(2){animation-delay:.15s}
.ivf-welcome-dots span:nth-child(3){animation-delay:.3s}
@keyframes ivfBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ivfGlow{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.1);opacity:1}}
@keyframes ivfDot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-2vh);opacity:1}}
@keyframes ivfIn{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
</style>
<!-- IvanaFin: welcome screen drawn from the first frame (replaces Jellyfin's splash logo).
     The server's "IvanaFin - Welcome screen" script adopts it and fades it out when Home is ready. -->
<div class="ivf-welcome" id="ivf-welcome-static">
  <div class="ivf-welcome-glow"></div>
  <div class="ivf-welcome-cat" style="background-image:url('ivf-welcome-cat.jpg')"></div>
  <div class="ivf-welcome-hi">Welcome to IvanaFin</div>
  <div class="ivf-welcome-line"></div>
  <div class="ivf-welcome-dots"><span></span><span></span><span></span></div>
</div>
<script>
(function () {
  var lines = ['Fluffing the cushions…', 'Dimming the lights…', 'Popping the popcorn…', 'Chasing the remote under the sofa…',
    'Warming up the projector…', 'Finding the comfy blanket…', 'Shooing the cat off the remote…', 'Rolling out the red carpet…',
    'Queueing up something good…', 'Putting the kettle on…'];
  var el = document.getElementById('ivf-welcome-static');
  window.__ivfWelcomeStart = Date.now();
  // Move it out of <body>: the web app clears/rebuilds body content while starting, which removed
  // the welcome screen after a split second. A child of <html> is left alone.
  document.documentElement.appendChild(el);
  el.querySelector('.ivf-welcome-line').textContent = lines[Math.floor(Math.random() * lines.length)];
  // Safety: if the server's script never takes over (server unreachable), don't block the app
  setTimeout(function () {
    if (!window.__ivfWelcomeAdopted && el.parentNode) { el.classList.add('ivf-out'); setTimeout(function () { el.remove(); }, 500); }
  }, 12000);
})();
</script>
